name: Build Tavrynexo Uninstaller

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "1.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/TavrynexoUninstaller/TavrynexoUninstaller.csproj -r win-x64

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src/TavrynexoUninstaller/TavrynexoUninstaller.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -p:FileVersion=${{ steps.ver.outputs.version }}.0
          -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item publish/TavrynexoUninstaller.exe TavrynexoUninstaller.exe
          Compress-Archive -Path publish/TavrynexoUninstaller.exe -DestinationPath TavrynexoUninstaller-win-x64.zip

      - name: Upload artifact (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoUninstaller-win-x64
          path: |
            TavrynexoUninstaller.exe
            TavrynexoUninstaller-win-x64.zip

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TavrynexoUninstaller.exe
            TavrynexoUninstaller-win-x64.zip
          generate_release_notes: true
